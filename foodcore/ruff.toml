# Pinned rule set, mirroring the host repo's ruff.toml so that lifting this
# directory into its own repository changes nothing about how it is linted.
#
# Selecting explicitly matters: without `select`, ruff falls back to its
# VERSION's defaults, which widened between 0.15 and 0.16 — so a local hook can
# block edits on rules CI never checked. Never pass `--select` on the command
# line either: it overrides this file, and with other rules off RUF100 deletes
# `# noqa` directives that CI still requires.
[lint]
select = ["E4", "E7", "E9", "F"]
