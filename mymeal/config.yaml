name: myMeal
version: "1.2.29"
slug: mymeal
description: Recipes, AI meal planning & smart shopping lists with a Home Assistant cooking assistant
url: https://github.com/Amantux/mymeal
# Pull the multi-arch image published by CI instead of building on-device.
image: ghcr.io/amantux/mymeal
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 7850
panel_icon: mdi:silverware-fork-knife
panel_title: myMeal
# Advertise to Home Assistant so the companion integration auto-discovers us.
discovery:
  - mymeal
# Query the Supervisor to auto-discover a companion Edibl add-on.
hassio_api: true
# manager role is needed to LIST/inspect sibling add-ons (e.g. Edibl) via the
# Supervisor — the default role can only read this add-on's own info.
hassio_role: manager
# Expose the MCP server (SSE) so the Home Assistant MCP Client can connect.
# Ports are INTERNAL-ONLY by default (null = not published to the host). myMeal
# is used via the sidebar (ingress), and Home Assistant reaches the MCP server
# on the internal network — neither needs a host port. To allow LAN access
# (e.g. the MCP Client from another machine, or the HACS integration over the
# network), set a host port for the relevant line in the add-on's Network tab.
ports:
  7850/tcp: null
  7851/tcp: null
ports_description:
  7850/tcp: myMeal REST API — map only for direct LAN / HACS-over-network access (Ingress does not need it)
  7851/tcp: myMeal MCP server (SSE) — to reach it from outside HA, turn on mcp_expose_external and mint a Full/MCP API key first, then map this port
map:
  - share:rw
options:
  disable_auth: true
  allow_registration: false
  enable_mcp: true
  mcp_server_token: ""
  mcp_expose_external: false
  ai_provider: ""
  ollama_host: ""
  ollama_model: ""
  ollama_api_key: ""
  ollama_search_key: ""
  claude_model: ""
  openai_model: ""
  openai_base_url: ""
  anthropic_api_key: ""
  openai_api_key: ""
  ai_timeout_seconds: 60
  edibl_url: ""
  edibl_token: ""
  database_url: ""
  use_shared_postgres: false
  postgres_provision_token: ""
  mcp_debug_tools: false
schema:
  disable_auth: bool
  allow_registration: bool
  enable_mcp: bool
  # Token Home Assistant's MCP Client must present. Leave blank on a trusted
  # network; set it before mapping the MCP port to the LAN.
  mcp_server_token: "password?"
  # Expose the MCP server outside Home Assistant. On = every request needs a
  # Full/MCP API key and the server won't start without one. Also map port 7851.
  mcp_expose_external: bool
  # Let an AI client read this add-on's own logs over MCP to help debug a
  # problem. Requires an API key with the 'debug' scope even inside Home
  # Assistant: logs contain sign-in emails and errors that can include
  # database credentials. Turn it off again when you are done.
  mcp_debug_tools: bool
  ai_provider: "list(|claude|ollama|ollama_cloud|openai)?"
  # AI provider config can be set here OR in the app UI (the app remembers UI
  # changes and they override these). Keys use HA's masked password type.
  ollama_host: "str?"
  ollama_model: "str?"
  ollama_api_key: "password?"
  ollama_search_key: "password?"
  claude_model: "str?"
  openai_model: "str?"
  # Point at any OpenAI-compatible server (a local SLM: LM Studio, vLLM, llama.cpp).
  openai_base_url: "str?"
  anthropic_api_key: "password?"
  openai_api_key: "password?"
  ai_timeout_seconds: "int(1,600)?"
  # Companion Edibl food-inventory app. Usually auto-discovered — leave blank.
  edibl_url: "str?"
  edibl_token: "password?"
  # Optional external database. Blank = built-in SQLite (recommended for most).
  # Postgres: postgresql+psycopg://user:pass@host:5432/dbname
  # Masked ("password?") because the URL normally embeds a password.
  database_url: "password?"
  # Turn on to use the separate "Shared PostgreSQL" add-on (auto-discovered).
  # Ignored if database_url is set. Leave the token blank to auto-obtain it.
  use_shared_postgres: bool
  postgres_provision_token: "password?"
