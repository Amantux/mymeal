whats_for_dinner:
  name: What's for dinner
  description: >-
    Return the meals planned for a day, plus a ready-to-speak sentence — handy
    for notifications and voice.
  fields:
    day:
      name: Day
      description: The date to check (YYYY-MM-DD). Defaults to today.
      required: false
      example: "2026-07-20"
      selector:
        text:

what_can_i_cook:
  name: What can I cook
  description: >-
    Suggest recipes you can make now, ranked by what's on hand (via Edibl). Returns
    the ranked list plus a ready-to-speak sentence.

add_to_shopping_list:
  name: Add to shopping list
  description: Add an item to your myMeal shopping list.
  fields:
    item:
      name: Item
      description: What to add.
      required: true
      example: eggs
      selector:
        text:

plan_week:
  name: Plan the week
  description: >-
    Generate a meal plan with AI and save it. Requires an AI provider to be
    configured in myMeal.
  fields:
    days:
      name: Days
      description: How many days to plan (1-14).
      required: false
      example: 7
      selector:
        number:
          min: 1
          max: 14
    preferences:
      name: Preferences
      description: Dietary preferences or constraints to respect.
      required: false
      example: vegetarian, quick weeknight meals
      selector:
        text:

search_recipes:
  name: Search recipes
  description: >-
    Find saved recipes by name or keyword, best match first. Matches on tags
    and descriptions too, not just the name. Returns each match with its id —
    use that id with the other recipe actions when a name is ambiguous.
  fields:
    query:
      name: Query
      description: Name or keyword to search for.
      required: true
      example: soup
      selector:
        text:

get_recipe:
  name: Get recipe
  description: Return a recipe's ingredients and steps.
  fields:
    name_or_id:
      name: Recipe
      description: Recipe name, slug, or id.
      required: true
      example: French Onion Soup
      selector:
        text:

add_recipe:
  name: Add recipe
  description: Create a new recipe.
  fields:
    name:
      name: Name
      description: Recipe name.
      required: true
      example: French Onion Soup
      selector:
        text:
    ingredients:
      name: Ingredients
      description: One line per ingredient.
      required: false
      example: '["2 onions", "1 l beef stock"]'
      selector:
        object:
    steps:
      name: Steps
      description: One line per step, in order.
      required: false
      example: '["Caramelise the onions", "Add the stock and simmer"]'
      selector:
        object:
    servings:
      name: Servings
      description: How many people it serves.
      required: false
      example: 4
      selector:
        number:
          min: 1
          max: 100

update_recipe:
  name: Update recipe
  description: >-
    Change a saved recipe. Only the fields you supply are touched — but note
    that supplying Ingredients or Steps REPLACES that whole list, so send the
    full list, not just the lines you changed. Every edit is snapshotted to the
    recipe's version history first, so it can be restored.
  fields:
    name_or_id:
      name: Recipe
      description: Recipe name, slug, or id.
      required: true
      example: French Onion Soup
      selector:
        text:
    name:
      name: New name
      description: Rename the recipe.
      required: false
      selector:
        text:
    ingredients:
      name: Ingredients
      description: Replaces the entire ingredient list. Omit to leave it alone.
      required: false
      example: '["3 onions", "1 l beef stock"]'
      selector:
        object:
    steps:
      name: Steps
      description: Replaces the entire step list. Omit to leave it alone.
      required: false
      selector:
        object:
    servings:
      name: Servings
      required: false
      selector:
        number:
          min: 1
          max: 100

delete_recipe:
  name: Delete recipe
  description: >-
    Permanently delete a recipe AND its saved versions/experiments. This cannot
    be undone (edits are recoverable from version history; deletes are not).
    Confirm must be set to true — call it once without to see what would go.
  fields:
    name_or_id:
      name: Recipe
      description: >-
        Recipe name, slug, or id. A name that matches several recipes is
        refused: the response has status needs_clarification and lists the
        candidates so you can re-run with the intended id.
      required: true
      example: French Onion Soup
      selector:
        text:
    confirm:
      name: Confirm
      description: Must be true to actually delete. False returns a preview instead.
      required: true
      example: true
      selector:
        boolean:

list_recipe_versions:
  name: List recipe versions
  description: >-
    List a recipe's saved versions — automatic edit-history snapshots and
    experiment branches — with their ids, labels and ratings.
  fields:
    name_or_id:
      name: Recipe
      description: Recipe name, slug, or id.
      required: true
      selector:
        text:

start_recipe_experiment:
  name: Start recipe experiment
  description: >-
    Branch an experiment from the recipe as it is now. Edit and cook the
    experiment without touching the live recipe, then promote it if it works.
  fields:
    name_or_id:
      name: Recipe
      description: Recipe name, slug, or id.
      required: true
      selector:
        text:
    label:
      name: Label
      description: Short name for the experiment.
      required: true
      example: More thyme, less salt
      selector:
        text:
    note:
      name: Note
      description: What you're trying and why.
      required: false
      selector:
        text:
          multiline: true

add_experiment_feedback:
  name: Add experiment feedback
  description: Record how an experiment turned out, so you can compare attempts.
  fields:
    name_or_id:
      name: Recipe
      required: true
      selector:
        text:
    version_id:
      name: Version
      description: Version id (from List recipe versions).
      required: true
      selector:
        text:
    rating:
      name: Rating
      description: 0-5.
      required: false
      example: 4
      selector:
        number:
          min: 0
          max: 5
    feedback:
      name: Feedback
      description: How it turned out, and what to change next time.
      required: false
      selector:
        text:
          multiline: true

promote_experiment:
  name: Promote experiment
  description: >-
    Make an experiment the live recipe. Reversible — the current version is
    snapshotted first, so you can restore it.
  fields:
    name_or_id:
      name: Recipe
      required: true
      selector:
        text:
    version_id:
      name: Version
      description: Version id (from List recipe versions).
      required: true
      selector:
        text:

restore_recipe_version:
  name: Restore recipe version
  description: >-
    Restore any saved version — an edit-history snapshot or an experiment — onto
    the live recipe. Reversible: the current state is snapshotted first.
  fields:
    name_or_id:
      name: Recipe
      required: true
      selector:
        text:
    version_id:
      name: Version
      description: Version id (from List recipe versions).
      required: true
      selector:
        text:
