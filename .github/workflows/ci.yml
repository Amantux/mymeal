name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel superseded runs on the same PR; never cancel a push to the default
  # branch (protects the version bump + image build/publish from interruption).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: test/build jobs install third-party dependencies,
# so they must NOT inherit a token that can push commits or images. The four
# jobs that genuinely need write scopes elevate them individually below.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Pin ruff so CI matches the version developers lint against locally —
          # an unpinned `ruff` silently pulls new releases whose changed lint
          # defaults then fail CI on unrelated, pre-existing code.
          # foodcore is pinned to a commit of its own repository inside
          # requirements.txt, so this one line installs it too — CI exercises
          # exactly the artifact the image ships, not a sibling checkout that
          # could silently differ.
          pip install -r requirements.txt pytest ruff==0.15.12
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Run pytest
        working-directory: backend
        run: pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 (LTS "Krypton"). jsdom >=30 pulls an undici that calls
          # `webidl.util.markAsUncloneable`, which needs the worker_threads
          # primitive added after Node 20 — on 20 every vitest worker dies with
          # "TypeError: webidl.util.markAsUncloneable is not a function".
          node-version: "24"
      - name: Install, test & build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run test
          npm run build

  validate-addon:
    name: Validate add-on + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate config.yaml / manifest.json / repository.yaml
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import json, yaml
          cfg = yaml.safe_load(open("mymeal/config.yaml"))
          for f in ("name", "version", "slug", "image", "arch"):
              assert f in cfg, f"config.yaml missing {f}"
          man = json.load(open("custom_components/mymeal/manifest.json"))
          assert man["domain"] == "mymeal"
          # add-on version and integration version must stay in lockstep
          assert str(cfg["version"]) == str(man["version"]), (
              f"version mismatch: config={cfg['version']} manifest={man['version']}"
          )
          yaml.safe_load(open("repository.yaml"))
          print("add-on config OK, version", cfg["version"])
          PY

  # Auto-bump the patch version on every push to main (skips its own commit).
  integration-tests:
    name: HA integration (services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Runs the companion integration's service tests in a real Home Assistant
    # env (py3.13). These cover the destructive-edit guards — a partial
    # update_recipe must not wipe ingredients, and delete_recipe must refuse
    # without confirmation — which nothing in the backend suite exercises.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install harness
        run: |
          python -m pip install --upgrade pip
          pip install -r custom_components/mymeal/tests/requirements_test.txt
      - name: Run integration tests
        # asyncio_mode=auto: the async test fns have no per-test marker. sys.path
        # is fixed in the tests' conftest so `custom_components.mymeal` imports.
        run: pytest custom_components/mymeal/tests -q -o asyncio_mode=auto

  bump-version:
    name: Auto-bump patch version
    runs-on: ubuntu-latest
    permissions:
      contents: write        # pushes the bump branch and merges the PR
      pull-requests: write   # main is protected, so the bump arrives as a PR
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [backend-tests, frontend-build, validate-addon, integration-tests]
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bump_sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Bump version and land it (via PR — main is protected)
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # main requires changes to arrive through a pull request, and this is
          # a PERSONAL repository, where GitHub does not offer bypass
          # allowances — those are org-only ("Only organization repositories can
          # have users and team restrictions"). So the bot cannot be let through
          # the rule; it has to satisfy it.
          #
          # It therefore opens a one-commit PR and merges it. With
          # required_approving_review_count = 0 nothing is waiting on a human,
          # so this is the same outcome as the old direct push, just legal.
          #
          # The loop still re-syncs and RECOMPUTES each attempt: another push
          # landing first means the version this run intended may already be
          # taken, and retrying it would mint a duplicate.
          for attempt in 1 2 3; do
            git fetch --quiet origin "${{ github.ref_name }}"
            git reset --quiet --hard "origin/${{ github.ref_name }}"

            BUMP_ENV_FILE=/tmp/bump.env python3 tools/bump_version.py
            . /tmp/bump.env

            BRANCH="chore/bump-${NEW_VERSION}-${GITHUB_RUN_ID}"
            git checkout --quiet -b "$BRANCH"
            git add mymeal/config.yaml custom_components/mymeal/manifest.json mymeal/CHANGELOG.md
            git commit --quiet -m "chore: bump version ${OLD_VERSION} → ${NEW_VERSION}"

            if ! git push --quiet origin "$BRANCH"; then
              echo "could not push the bump branch; retrying"
              git checkout --quiet - && sleep $((attempt * 3)); continue
            fi

            gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
              --title "chore: bump version ${OLD_VERSION} → ${NEW_VERSION}" \
              --body "Automated add-on version bump so the Supervisor sees an update. Opened as a PR because main requires one and bypass allowances are not available on a personal repository."

            # --merge, not --squash: the add-on release jobs key off this commit,
            # and --admin is NOT used, so a future tightening of the rule will
            # fail loudly here rather than being quietly overridden.
            if gh pr merge "$BRANCH" --merge --delete-branch; then
              git fetch --quiet origin "${{ github.ref_name }}"
              echo "sha=$(git rev-parse origin/${{ github.ref_name }})" >> "$GITHUB_OUTPUT"
              echo "landed ${NEW_VERSION} on attempt $attempt"
              exit 0
            fi

            echo "merge rejected (main likely moved); recomputing — attempt $attempt"
            gh pr close "$BRANCH" --delete-branch || true
            git checkout --quiet -
            sleep $((attempt * 3))
          done
          echo "::error::could not land the version bump after 3 attempts"
          exit 1

  # Build each architecture on a native runner (no QEMU) and push per-arch tags.
  docker-build:
    name: Build & push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write   # pushes per-arch images to GHCR
    timeout-minutes: 40
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [bump-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push per-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/amantux/mymeal:${{ needs.bump-version.outputs.new_version }}-${{ matrix.arch }}
            ghcr.io/amantux/mymeal:latest-${{ matrix.arch }}

  merge-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # pushes the multi-arch manifest to GHCR
    timeout-minutes: 10
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [bump-version, docker-build]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        run: |
          V=${{ needs.bump-version.outputs.new_version }}
          docker buildx imagetools create \
            --tag ghcr.io/amantux/mymeal:${V} \
            --tag ghcr.io/amantux/mymeal:latest \
            ghcr.io/amantux/mymeal:${V}-amd64 \
            ghcr.io/amantux/mymeal:${V}-arm64
          echo "Published ghcr.io/amantux/mymeal:${V} (amd64 + arm64)"

  release:
    name: GitHub release (HACS)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the GitHub release
    timeout-minutes: 10
    if: >
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    needs: [bump-version, merge-manifest]
    steps:
      - name: Create release v${{ needs.bump-version.outputs.new_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.bump-version.outputs.new_version }}
          SHA: ${{ needs.bump-version.outputs.bump_sha }}
          REPO: ${{ github.repository }}
        run: |
          # Retry on transient GitHub API failures. A 503 here is not cosmetic:
          # HACS validates the LATEST RELEASE, so a lost release leaves the repo
          # shipping a version HACS users cannot get. This happened on v0.5.7.
          create_release() {
            gh release create "v${V}" \
              --repo "$REPO" \
              --target "$SHA" \
              --title "v${V}" \
              --notes "myMeal ${V} — Home Assistant add-on & HACS integration. Container image: ghcr.io/amantux/mymeal:${V}"
          }

          if gh release view "v${V}" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v${V} already exists — skipping."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if create_release; then
              echo "Created release v${V} at ${SHA} (attempt ${attempt})"
              exit 0
            fi
            # Another run may have won the race between our check and our create.
            if gh release view "v${V}" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release v${V} appeared concurrently — nothing to do."
              exit 0
            fi
            backoff=$((attempt * 15))
            echo "Release creation failed (attempt ${attempt}/5); retrying in ${backoff}s." >&2
            sleep "$backoff"
          done

          echo "::error::Could not create release v${V} after 5 attempts. The repo" \
               "now ships a version with no release, and HACS serves the previous" \
               "one. Re-run this job, or create the release manually." >&2
          exit 1
